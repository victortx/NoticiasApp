  <div class="container-fluid py-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <button type="button" class="btn btn-outline-primary" (click)="openCrear()">Crear Categoria</button>
    </div>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0">Categorías</h5>
      <div class="btn-group">
        <button class="btn btn-outline-secondary btn-sm"
                [disabled]="!data?.previous || loading"
                (click)="prev()">
          ← Anterior
        </button>
        <button class="btn btn-outline-secondary btn-sm"
                [disabled]="!data?.next || loading"
                (click)="next()">
          Siguiente →
        </button>
      </div>
    </div>

    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border" role="status"></div>
    </div>

    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

    <div class="table-responsive" *ngIf="!loading">
      <table class="table table-hover align-middle">
        <thead class="table-light">
        <tr>
          <th style="width: 90px;">ID</th>
          <th>Nombre</th>
          <th>Slug</th>
          <th class="text-end" style="width: 140px;">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let c of data?.results; trackBy: trackById">
          <td>{{ c.id }}</td>
          <td>{{ c.nombre }}</td>
          <td><code class="small">{{ c.slug }}</code></td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-secondary ms-1" (click)="openEditar(c)">Editar</button>
          </td>
        </tr>

        <tr *ngIf="!data?.results?.length">
          <td colspan="4" class="text-center text-muted">No hay categorías.</td>
        </tr>
        </tbody>
      </table>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-2" *ngIf="data">
      <div class="small text-muted">Total: {{ data.count | number }}</div>
      <div class="btn-group">
        <button class="btn btn-outline-secondary btn-sm"
                [disabled]="!data.previous || loading"
                (click)="prev()">
          ← Anterior
        </button>
        <button class="btn btn-outline-secondary btn-sm"
                [disabled]="!data.next || loading"
                (click)="next()">
          Siguiente →
        </button>
      </div>
    </div>
  </div>
  <!-- Modal SIEMPRE presente, sin *ngIf -->
  <app-categorias-create-modal
    #crearModal
    (created)="onCreated()"
    (updated)="onUpdated()">
  </app-categorias-create-modal>
