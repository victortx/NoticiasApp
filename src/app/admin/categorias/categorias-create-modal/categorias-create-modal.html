<div #modalEl class="modal fade" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header">
        <h5 class="modal-title">
          {{ mode === 'create' ? 'Nueva categoría' : 'Editar categoría' }}
        </h5>
        <button type="button" class="btn-close" (click)="close()" aria-label="Cerrar"></button>
      </div>

      <div class="modal-body">
        <form (ngSubmit)="submit()" [formGroup]="form" novalidate>
          <div class="mb-3">
            <label class="form-label" for="nombre">Nombre</label>
            <input id="nombre" type="text" class="form-control"
                   formControlName="nombre" (input)="onNombreInput()">
            <div class="invalid-feedback d-block"
                 *ngIf="form.controls['nombre'].touched && form.controls['nombre'].invalid">
              Debe ingresar un nombre (mín. 3 caracteres).
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="slug">Slug</label>
            <input id="slug" type="text" class="form-control" formControlName="slug">
            <div class="invalid-feedback d-block"
                 *ngIf="form.controls['slug'].touched && form.controls['slug'].invalid">
              Debe ingresar un slug válido (mín. 3 caracteres).
            </div>
          </div>

          <div class="alert alert-danger py-2" *ngIf="errorMsg">{{ errorMsg }}</div>

          <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-outline-secondary" [disabled]="loading" (click)="close()">Cancelar</button>
            <button type="submit" class="btn btn-primary" [disabled]="loading">
              <span *ngIf="!loading">{{ mode === 'create' ? 'Guardar' : 'Actualizar' }}</span>
              <span *ngIf="loading" class="d-inline-flex align-items-center gap-2">
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                {{ mode === 'create' ? 'Guardando…' : 'Actualizando…' }}
              </span>
            </button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
