<aside class="sidebar d-flex flex-column border-end">
  <div class="p-3 pb-2 border-bottom">
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-speedometer fs-4"></i>
      <strong>Admin</strong>
    </div>
  </div>

  <ng-container *ngIf="menu$ | async as menu; else cargando">
    <nav class="nav flex-column py-2">
      <a *ngFor="let item of menu"
         [routerLink]="item.fullPath || ['/dashboard', item.ruta]"
         routerLinkActive="active"
         class="nav-link d-flex align-items-center gap-2 px-3">
        <!-- 👇 icono dinámico desde la API -->
        <i class="bi" [ngClass]="normalizeIcon(item.icono)"></i>
        <span>{{ item.nombre }}</span>
      </a>
    </nav>

    <div *ngIf="menu.length === 0" class="text-muted small px-3 pb-3">
      No hay opciones disponibles.
    </div>
  </ng-container>

  <ng-template #cargando>
    <div class="px-3 py-3">
      <div class="spinner-border spinner-border-sm" role="status"></div>
      <span class="ms-2 small text-muted">Cargando menú…</span>
    </div>
  </ng-template>

  <div class="mt-auto small text-muted px-3 pb-3"></div>
</aside>
