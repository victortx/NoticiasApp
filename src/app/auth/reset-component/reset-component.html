<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="col-12 col-sm-10 col-md-6 col-lg-4">
    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-body p-4">
        <h1 class="h5 mb-3"><i class="bi bi-key me-2"></i> Reiniciar contraseña</h1>

        <div class="alert alert-warning py-2" *ngIf="!uid || !token">
          Enlace inválido o incompleto.
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate *ngIf="uid && token">
          <label class="form-label" for="password">Nueva contraseña</label>
          <input id="password" type="password" class="form-control" formControlName="password" placeholder="••••••••" />
          <div class="small mt-2">
            Debe tener 8–16, minúscula, mayúscula, dígito y caracter especial.
          </div>
          <div class="invalid-feedback d-block" *ngIf="this.f['password'].touched && this.f['password'].invalid">
            La contraseña no cumple los requisitos.
          </div>

          <label class="form-label mt-3" for="confirm">Confirmar contraseña</label>
          <input id="confirm" type="password" class="form-control" formControlName="confirm" placeholder="Repite la contraseña" />
          <div class="invalid-feedback d-block" *ngIf="this.f['confirm'].touched && this.f['confirm'].invalid">
            Las contraseñas no coinciden.
          </div>

          <button class="btn btn-primary w-100 mt-3" [disabled]="isSubmitting">
            <span *ngIf="!isSubmitting">Guardar contraseña</span>
            <span *ngIf="isSubmitting" class="d-inline-flex align-items-center gap-2">
              <span class="spinner-border spinner-border-sm"></span> Guardando…
            </span>
          </button>
        </form>

        <div class="alert alert-danger mt-3 py-2" *ngIf="errorMsg">{{ errorMsg }}</div>
        <div class="alert alert-success mt-3 py-2" *ngIf="successMsg">{{ successMsg }}</div>
      </div>
    </div>
  </div>
</div>
