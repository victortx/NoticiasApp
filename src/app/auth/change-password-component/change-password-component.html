<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-5">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4">
          <h1 class="h5 mb-3"><i class="bi bi-lock me-2"></i> Cambiar contraseña</h1>

          <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <label class="form-label" for="current">Contraseña actual</label>
            <input id="current" type="password" class="form-control" formControlName="current_password" />
            <div class="invalid-feedback d-block" *ngIf="this.f['current_password'].touched && this.f['current_password'].invalid">
              Requerida.
            </div>

            <label class="form-label mt-3" for="new">Nueva contraseña</label>
            <input id="new" type="password" class="form-control" formControlName="new_password" />
            <div class="small mt-2">
              Debe tener 8–16, minúscula, mayúscula, dígito y caracter especial. No se permite reutilizar contraseñas.
            </div>
            <div class="invalid-feedback d-block" *ngIf="this.f['new_password'].touched && this.f['new_password'].invalid">
              La contraseña no cumple los requisitos.
            </div>

            <label class="form-label mt-3" for="confirm">Confirmar</label>
            <input id="confirm" type="password" class="form-control" formControlName="confirm" />
            <div class="invalid-feedback d-block" *ngIf="this.f['confirm'].touched && this.f['confirm'].invalid">
              Las contraseñas no coinciden.
            </div>

            <button class="btn btn-primary w-100 mt-3" [disabled]="isSubmitting">
              <span *ngIf="!isSubmitting">Guardar</span>
              <span *ngIf="isSubmitting" class="d-inline-flex align-items-center gap-2">
                <span class="spinner-border spinner-border-sm"></span> Guardando…
              </span>
            </button>
          </form>

          <div class="alert alert-danger mt-3 py-2" *ngIf="errorMsg">{{ errorMsg }}</div>
          <div class="alert alert-success mt-3 py-2" *ngIf="successMsg">{{ successMsg }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
