<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="row w-100 justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-4">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <i class="bi bi-newspaper display-5"></i>
            <h1 class="h4 mt-2 mb-0">Noticias App</h1>
            <p class="text-body-secondary mb-0">Iniciar sesión</p>
          </div>

          <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label">Correo Electronico</label>
              <input
                id="email"
                type="text"
                class="form-control"
                formControlName="email"
                placeholder="Tu usuario">
              <div class="invalid-feedback d-block" *ngIf="hasError('email','required')">
                El correo es obligatorio.
              </div>
              <div class="invalid-feedback d-block" *ngIf="hasError('email','minlength')">
                Debe tener al menos 3 caracteres.
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input
                id="password"
                type="password"
                class="form-control"
                formControlName="password"
                placeholder="••••••">
              <div class="invalid-feedback d-block" *ngIf="hasError('password','required')">
                La contraseña es obligatoria.
              </div>
              <div class="invalid-feedback d-block" *ngIf="hasError('password','minlength')">
                Debe tener al menos 4 caracteres.
              </div>
            </div>

            <button
              type="submit"
              class="btn btn-primary w-100"
              [disabled]="isSubmitting">
              <span *ngIf="!isSubmitting">Ingresar</span>
              <span *ngIf="isSubmitting" class="d-inline-flex align-items-center gap-2">
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                Procesando…
              </span>
            </button>

            <div class="alert alert-danger mt-3 py-2" *ngIf="errorMsg">
              {{ errorMsg }}
            </div>

            <div class="text-center mt-4">
              <a [routerLink]="['/auth/registro']">¿No tienes cuenta? Crear cuenta</a>
            </div>
          </form>

          <div class="text-center mt-4">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
