<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="col-12 col-sm-10 col-md-6 col-lg-4">
    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-body p-4">
        <h1 class="h5 mb-3"><i class="bi bi-envelope me-2"></i> Recuperar contraseña</h1>

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <label class="form-label" for="email">Correo</label>
          <input id="email" type="email" class="form-control" formControlName="email" placeholder="tucorreo@dominio.com">
          <div class="invalid-feedback d-block" *ngIf="this.f['email'].touched && this.f['email'].invalid">Correo inválido.</div>

          <button class="btn btn-primary w-100 mt-3" [disabled]="isSubmitting">
            <span *ngIf="!isSubmitting">Enviar instrucciones</span>
            <span *ngIf="isSubmitting" class="d-inline-flex align-items-center gap-2">
              <span class="spinner-border spinner-border-sm"></span> Enviando…
            </span>
          </button>
        </form>

        <div class="alert alert-info mt-3 py-2" *ngIf="msg">{{ msg }}</div>
      </div>
    </div>
  </div>
</div>
